name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for z in *.zip; do unzip -oq "$z"; done
      - name: Find project folder
        id: p
        run: |
          f=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: App-apk
          path: "**/build/outputs/apk/debug/*.apk"
